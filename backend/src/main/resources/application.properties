spring.application.name=backend

# --- Connexion a la base PostgreSQL ---
# Le mot de passe vient de l'environnement, jamais du depot.
spring.datasource.url=jdbc:postgresql://localhost:5432/merombe
spring.datasource.username=postgres
spring.datasource.password=${MEROMBE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# none = Hibernate ne touche pas aux tables, c'est ton script SQL qui commande
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# la connexion est rendue des la fin du traitement, pas a la fin de l'affichage
spring.jpa.open-in-view=false

# --- Serveur ---
server.port=8080

# --- Securite ---
# Clef de signature des jetons et des QR codes.
# Aucune valeur par defaut : le serveur refuse de demarrer sans elle.
merombe.jwt.secret=${MEROMBE_SECRET}
merombe.jwt.duree-ms=86400000

# Secret partage avec l'agregateur de paiement pour signer ses rappels
merombe.rappel.secret=${MEROMBE_RAPPEL_SECRET}

spring.security.user.name=desactive
spring.security.user.password=desactive